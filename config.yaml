baseURL: ''  # TODO: must be changed
theme: hugobricks
defaultContentLanguage: it
assetDir: static

markup:
  goldmark:
    renderer:
      unsafe: true # Allow HTML in md files

languages:
  it:
    label: Italiano
    contentDir: content/it
    weight: 1
    disabled: false
  en:
    label: English
    contentDir: content/en
    weight: 2
  ar:
    label: العربية
    contentDir: content/ar
    weight: 3
    direction: rtl
